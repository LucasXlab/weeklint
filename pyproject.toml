[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weeklint"
version = "0.1.0"
description = "Local-first weekly feasibility checker for ICS calendars and Markdown tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Weeklint contributors"}]
keywords = ["calendar", "planning", "productivity", "ics", "markdown", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "icalendar>=6.1,<7",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
weeklint = "weeklint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
